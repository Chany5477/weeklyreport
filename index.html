<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>市场回顾 · 10.19–10.23</title>
<style>
:root{
  --red:#C8102E; --red2:#E24B3F; --green:#0E9F6E; --green2:#12B886;
  --ink:#191919; --ink2:#3d3d3d; --muted:#8a8a8a; --line:#e8e6e2;
  --bg:#ffffff; --bg2:#FAF9F7; --warn:#F59E0B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg2)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink); font-size:15px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:780px;margin:0 auto;background:var(--bg);min-height:100vh;padding-bottom:56px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- header ---------- */
header{padding:30px 24px 22px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.brand b{color:var(--red);letter-spacing:.1em;font-weight:700}
h1{font-size:29px;line-height:1.35;margin:14px 0 10px;font-weight:800;letter-spacing:-.4px}
h1 em{font-style:normal;color:var(--red)}
.lead{font-size:15px;color:var(--ink2);margin:0;line-height:1.75}
.badge{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-size:12px;padding:5px 11px;border-radius:100px;background:#F0FBF6;color:#0B7A55;border:1px solid #C9EEDF}
.badge.bad{background:#FFF8EB;color:#92560A;border-color:#F6E0B8}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* ---------- day strip ---------- */
.days{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}
.day{padding:16px 4px 15px;text-align:center;border-right:1px solid var(--line)}
.day:last-child{border-right:0}
.day .w{font-size:11px;color:var(--muted);letter-spacing:.06em}
.day .c{font-size:19px;font-weight:700;margin-top:5px;letter-spacing:-.5px}
.day .m{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.up{color:var(--red)} .down{color:var(--green)}

/* ---------- section ---------- */
section{padding:26px 24px;border-bottom:1px solid var(--line)}
section:last-of-type{border-bottom:0}
h2{font-size:16px;margin:0 0 4px;font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:3px;height:15px;background:var(--red);border-radius:2px}
.sub{font-size:12px;color:var(--muted);margin:0 0 16px}
p{margin:0 0 12px}
p:last-child{margin-bottom:0}
.kw{font-weight:700}
.hl{background:linear-gradient(transparent 62%,rgba(200,16,46,.14) 62%);font-weight:700}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;color:var(--muted);font-weight:500;text-align:right;padding:0 0 8px;letter-spacing:.04em}
th:first-child,td:first-child{text-align:left}
td{padding:9px 0;border-top:1px solid var(--line);text-align:right}
td:first-child{color:var(--ink2)}
tr.tot td{font-weight:700;border-top:1px solid var(--ink)}

/* ---------- charts ---------- */
.chart-wrap{margin-top:8px}
svg{display:block;width:100%;height:auto;overflow:visible}
.hbar{display:flex;flex-direction:column;gap:0}
.hrow{display:grid;grid-template-columns:66px 1fr 54px;align-items:center;gap:8px;height:23px}
.hrow .n{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .track{position:relative;height:13px;background:#F6F5F3;border-radius:2px;overflow:hidden}
.hrow .zero{position:absolute;top:0;bottom:0;left:50%;width:1px;background:#DEDBD5}
.hrow .bar{position:absolute;top:1.5px;height:10px;border-radius:1px}
.hrow .v{font-size:12px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.hrow.mid .n{font-weight:700}

/* ---------- heat grid ---------- */
.heat{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.heat .c{border-radius:3px;padding:7px 3px 6px;text-align:center}
.heat .c .n{font-size:10px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heat .c .v{font-size:11px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.heat-bar{display:flex;align-items:center;justify-content:space-between;margin-top:9px;font-size:10.5px;color:var(--muted)}
.heat-bar .sc{display:flex;align-items:center;gap:3px}
.heat-bar .sw{display:flex;gap:1px}
.heat-bar .sw i{display:block;width:13px;height:8px;border-radius:1px}
.heat-cap{font-size:11.5px;color:var(--muted);margin:16px 0 8px;letter-spacing:.04em}

/* ---------- tech ---------- */
.tech-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tcard{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 12px 11px}
.tcard .k{font-size:11px;color:var(--muted);letter-spacing:.03em}
.tcard .v{font-size:17px;font-weight:700;margin-top:3px;letter-spacing:-.3px}
.tcard .d{font-size:10.5px;color:var(--muted);margin-top:2px}
.alert{display:flex;gap:10px;padding:13px 15px;border-radius:10px;background:#FFF7F5;border:1px solid #F5D6CF;font-size:13.5px;line-height:1.65;margin-top:4px}
.alert .ic{color:var(--red);font-weight:800;flex:none}

/* ---------- outlook ---------- */
.ol{display:flex;flex-direction:column;gap:0}
.oi{display:grid;grid-template-columns:26px 1fr;gap:2px;padding:13px 0;border-top:1px dashed var(--line)}
.oi:first-child{border-top:0;padding-top:0}
.oi .no{font-size:12px;font-weight:800;color:var(--red);padding-top:2px;font-variant-numeric:tabular-nums}
.oi .t{font-size:14px;font-weight:700;margin-bottom:3px}
.oi .d{font-size:13.5px;color:var(--ink2);line-height:1.7}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px;font-weight:600}
.tag.pos{background:#FDECEA;color:#A50D24}
.tag.neg{background:#E9F7F0;color:#0B7A55}
.tag.neu{background:#F1F0EE;color:#6b6b6b}

/* ---------- footer ---------- */
footer{padding:22px 24px 0;font-size:11.5px;color:var(--muted);line-height:1.85}
footer b{color:var(--ink2);font-weight:600}
.empty{padding:14px;border:1px dashed var(--line);border-radius:10px;font-size:12.5px;color:var(--muted);background:var(--bg2)}
.ev{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:11px 0;border-top:1px dashed var(--line);font-size:13.5px;line-height:1.7}
.ev:first-child{border-top:0;padding-top:0}
.ev .evd{font-size:12px;color:var(--muted);padding-top:2px}
.ev .evt{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;background:#F2F0EC;color:#6b6b6b;margin-right:6px;vertical-align:1px}
.ev .evs{font-size:11px;color:var(--muted);margin-top:2px}
@media (max-width:480px){
  .heat{grid-template-columns:repeat(6,1fr)}
  .heat .c .n{font-size:9.5px}
}
@media (max-width:420px){
  h1{font-size:25px}
  header,section{padding-left:18px;padding-right:18px}
  .tech-grid{grid-template-columns:repeat(2,1fr)}
  .day .c{font-size:16px}
}
</style>
</head>

(function(){
  var D = JSON.parse(document.getElementById('DATA').textContent);
  var RED='#C8102E', GREEN='#0E9F6E', GRAY='#B9B4AC';
  var $ = function(id){ return document.getElementById(id); };
  var pct = function(v){ return (v>0?'+':'') + (v==null?'--':v.toFixed(2)) + '%'; };
  var cls = function(v){ return v>0?'up':(v<0?'down':''); };

  /* 状态徽章 */
  var okAll = D.status === 'ok';
  var t = new Date(D.generatedAt);
  var hm = ('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2);
  $('status').innerHTML = '<span class="badge'+(okAll?'':' bad')+'"><span class="dot"></span>'+
    (okAll ? '数据校验通过 · 截至 '+D.week.end+' 收盘 · 抓取 '+hm
           : '数据未就绪 · 见页尾缺失项')+'</span>';

  /* 五个交易日 */
  var WD=['周一','周二','周三','周四','周五'];
  $('days').innerHTML = D.days.map(function(d,i){
    var v = d.vr;
    var mtxt = '振幅'+d.amp.toFixed(1)+'%'+(v?(' · '+(v>1.12?'放量':v<0.95?'缩量':'平量')+v.toFixed(2)+'x'):'');

      '<div class="c num '+cls(d.chg)+'">'+pct(d.chg)+'</div>'+
      '<div class="m num">'+mtxt+'</div></div>';
  }).join('');

  /* 结论 */
  var I = {}; D.indices.forEach(function(x){ I[x.name]=x; });
  var up = D.indices.filter(function(x){return x.chg>0;}).length;
  var best = D.indices.slice().sort(function(a,b){return b.chg-a.chg;})[0];
  var worst = D.indices.slice().sort(function(a,b){return a.chg-b.chg;})[0];
  var lead = D.industries[0], lag = D.industries[D.industries.length-1];
  var spread = (lead.chg - lag.chg).toFixed(2);

  var shc = D.indices[0].chg;
  $('conclusion').innerHTML =
    '<p><span class="kw">指数：</span>上证指数本周收于 <span class="num">'+D.indices[0].close.toFixed(2)+'</span> 点，'+

  /* 指数柱状图 */
  (function(){
    var data = D.indices;
    var W=740, H=340, padL=8, padR=8, padT=36, padB=62;
    var max = Math.max.apply(null, data.map(function(d){return Math.abs(d.chg);}).concat([1]));
    var unit = (H-padT-padB)/2/max;
    var zero = padT + (H-padT-padB)/2;
    var bw = (W-padL-padR)/data.length;
    var s = '<svg viewBox="0 0 '+W+' '+H+'" role="img">';
    s += '<line x1="0" y1="'+zero+'" x2="'+W+'" y2="'+zero+'" stroke="#E0DDD7" stroke-width="1"/>';
    data.forEach(function(d,i){
      var h = Math.abs(d.chg)*unit;
      var x = padL + i*bw + bw*0.26, w = bw*0.48;
      var y = d.chg>=0 ? zero-h : zero;
      var color = d.chg>=0?RED:GREEN;
      s += '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+Math.max(h,1)+'" rx="1.5" fill="'+color+'"/>';
      var ty = d.chg>=0 ? y-8 : y+Math.max(h,1)+16;
      s += '<text x="'+(x+w/2)+'" y="'+ty+'" font-size="13" font-weight="700" fill="'+color+'" text-anchor="middle" font-family="-apple-system,sans-serif">'+pct(d.chg)+'</text>';
      s += '<text x="'+(x+w/2)+'" y="'+(H-22)+'" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-family="-apple-system,sans-serif">'+
           d.name+'</text>';
    });
    s += '</svg>';
    $('idxChart').innerHTML = s;
  })();

  /* 指数表 */
  $('idxTable').innerHTML = '<thead><tr><th>指数</th><th>收盘</th><th>周涨跌</th><th>周振幅</th><th>量能</th></tr></thead><tbody>'+
    D.indices.map(function(d){
      return '<tr><td>'+d.name+'</td><td class="num">'+d.close.toFixed(2)+'</td>'+
        '<td class="num '+cls(d.chg)+'">'+pct(d.chg)+'</td>'+
        '<td class="num">'+d.amp.toFixed(1)+'%</td>'+
        '<td class="num" style="color:#8a8a8a">'+(d.volRatio?d.volRatio.toFixed(2)+'x':'--')+'</td></tr>';
    }).join('')+'</tbody>';

  /* 行业热力方格 */
  (function(){
    var arr = D.industries;
    var max = Math.max.apply(null, arr.map(function(d){return Math.abs(d.chg);}).concat([1]));
    var rgba = function(hex, t){
      var c = [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
      var k = 0.10 + 0.90*t;
      return 'rgb('+c.map(function(v){return Math.round(255-(255-v)*k);}).join(',')+')';
    };
    $('indHeat').innerHTML = arr.map(function(d){
      var t = Math.min(1, Math.abs(d.chg)/max);
      var bg = d.chg > 0 ? rgba(RED,t) : d.chg < 0 ? rgba(GREEN,t) : '#D7D2CA';
      var fg = t > 0.42 ? '#ffffff' : (d.chg > 0 ? '#8C0B22' : '#0A6647');
      return '<div class="c" style="background:'+bg+';color:'+fg+'">'+
        '<div class="n">'+d.name+'</div><div class="v">'+pct(d.chg)+'</div></div>';
    }).join('');
    var sw = function(id, hex){
      var s = '';
      for(var i=0;i<5;i++) s += '<i style="background:'+rgba(hex, i/4)+'"></i>';
      $(id).innerHTML = s;
    };
    sw('swDown', GREEN); sw('swUp', RED);
  })();

  /* 行业横条 */
  (function(){
    var arr = D.industries;
    var max = Math.max.apply(null, arr.map(function(d){return Math.abs(d.chg);}).concat([1]));
    $('indBars').innerHTML = arr.map(function(d){
      var w = Math.abs(d.chg)/max*50;
      var color = d.chg>=0?RED:GREEN;
      var style = d.chg>=0
        ? 'left:50%;width:'+w+'%;background:'+color
        : 'right:50%;width:'+w+'%;background:'+color;
      return '<div class="hrow'+(Math.abs(d.chg)===max?' mid':'')+'">'+
        '<div class="n">'+d.name+'</div>'+
        '<div class="track"><div class="zero"></div><div class="bar" style="'+style+'"></div></div>'+
        '<div class="v '+cls(d.chg)+'">'+pct(d.chg)+'</div></div>';
    }).join('');
  })();

  /* 技术面 */
  (function(){
    var T = D.tech;
    var sig = (D.signals||[]).slice().sort(function(a,b){return (b.raw||0)-(a.raw||0);})[0];
    if(sig){
      var why = '';
      if(sig.k.indexOf('60日')===0) why = T.vsMa60<0
        ? '指数仍在 60 日均线下方运行，中期修复要先收复这条线。'
        : '指数站在 60 日均线上方，中期结构没有被破坏。';
      else if(sig.k.indexOf('距年内')===0) why = (T.drawdown<-15)
        ? '回撤已经超过 15%，属于深度回撤区间，修复需要更长时间和更明确的增量资金。'
        : (T.drawdown<-8
          ? '回撤接近一成，说明今年的浮盈已经回吐大半，反弹到这个区间会先遇到解套盘的压力。'
          : '回撤幅度可控，中期趋势尚未被破坏，更多是情绪与结构问题。');
      else why = (T.vol20d>22)
        ? '波动率明显高于常态，单日 2% 级别的涨跌属于正常范围，仓位不宜按低波动环境计算。'
        : '波动率处于正常区间，短期没有出现极端情绪。';
      $('techAlert').innerHTML = '<div class="alert"><span class="ic">!</span><div>本周真正需要盯住的是 '+
        '<b>'+sig.k+'</b>：'+sig.v+'。'+why+'</div></div>';
    }
    var cards = [
      ['20日均线', T.ma20?T.ma20.toFixed(0):'--', T.vsMa20!=null?('偏离 '+T.vsMa20.toFixed(2)+'%'):'', null, T.vsMa20],
      ['60日均线', T.ma60?T.ma60.toFixed(0):'--', T.vsMa60!=null?('偏离 '+T.vsMa60.toFixed(2)+'%'):'', null, T.vsMa60],
      ['本周振幅', T.weekAmp!=null?T.weekAmp.toFixed(2)+'%':'--', '高'+T.weekHigh.toFixed(0)+' 低'+T.weekLow.toFixed(0), null, null],
      ['距年内高点', T.drawdown!=null?Math.abs(T.drawdown).toFixed(2)+'%':'--', '回撤幅度', T.drawdown, null],
      ['20日年化波动', T.vol20d!=null?T.vol20d.toFixed(1)+'%':'--', T.vol20d>22?'偏高':'正常', null, null],
      ['周线连动', T.streak ? ((T.streak>0?'连涨 ':'连跌 ')+Math.abs(T.streak)+' 周') : '--', '周线口径', T.streak?Math.sign(T.streak):null, null]
    ];
    $('techGrid').innerHTML = cards.map(function(c){
      return '<div class="tcard"><div class="k">'+c[0]+'</div>'+
        '<div class="v num '+(c[3]==null?'':cls(c[3]))+'">'+c[1]+'</div>'+
        '<div class="d '+(c[4]==null?'':cls(c[4]))+'">'+c[2]+'</div></div>';
    }).join('');
  })();

  /* 展望 */
  $('outlook').innerHTML = D.outlook.map(function(o,i){
    return '<div class="oi"><div class="no">0'+(i+1)+'</div><div>'+
      '<div class="t">'+o.t+'<span class="tag '+o.tone+'">'+(o.tone==='pos'?'偏正面':o.tone==='neg'?'偏谨慎':'中性')+'</span></div>'+
      '<div class="d">'+o.d+'</div></div></div>';
  }).join('');

  /* 人工事件 */
  var ev = (D.manual && D.manual.events) || [];
  $('events').innerHTML = ev.length
    ? ev.map(function(e){
        return '<div class="ev"><div class="evd num">'+(e.date||'').slice(5)+'</div><div>'+
          (e.tag?'<span class="evt">'+e.tag+'</span>':'')+(e.text||'')+
          (e.src?'<div class="evs">'+e.src+'</div>':'')+'</div></div>';
      }).join('')
    : '<div class="empty">本期未填写。在 <b>data/manual.json</b> 里按下面的格式补上核对过的当日原因，重跑一次就会出现在这里：'+
      '<pre style="margin:8px 0 0;white-space:pre-wrap;font-size:11.5px;color:#6b6b6b">'+
      '{ "events": [ { "date": "2026-10-20", "tag": "政策", "text": "…（一句话事实+影响）" } ] }</pre>'+
      '不自动生成，是为了不把猜测写成事实。</div>';

  /* 页脚 */
  var bad = (D.checks||[]).filter(function(c){return !c.ok;});
  var ft = '<div><b>数据源</b>：'+(D.sources||[]).join('、')+'</div>';
  ft += '<div><b>生成时间</b>：'+D.week.end+' '+hm+'（收盘后）　<b>下次更新</b>：周五 15:35</div>';
  if(bad.length){
    ft += '<div style="margin-top:6px;color:#92560A"><b>缺失项</b>：'+bad.map(function(c){return c.key+'（'+c.msg+'）';}).join('；')+'</div>';
    ft += '<div style="margin-top:4px">可稍后重新抓取一次，本页为静态快照，重跑后自动更新。</div>';
  } else {
    ft += '<div><b>校验</b>：指数/行业/家数/涨跌停 全部对齐 '+D.week.end+' 收盘数据，31 个申万一级行业无缺失。</div>';
  }
  ft += '<div style="margin-top:8px;opacity:.8">本文由数据自动生成，仅作信息记录，不构成投资建议。</div>';
  $('foot').innerHTML = ft;
})();
</script>
</body>
</html>
