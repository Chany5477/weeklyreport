name: weekly-review

# 北京时间 周五 15:35 / 16:10 / 17:30 各跑一次全套（UTC = 北京时间 - 8h）
on:
  schedule:
    - cron: '35 7 * * 5'
    - cron: '10 8 * * 5'
    - cron: '30 9 * * 5'
  workflow_dispatch: {}          # GitHub 页面上手动重跑的按钮

permissions:
  contents: write                # 归档 JSON + 发布 index.html

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.gate.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 抓数最多重试 3 次，直到数据校验通过为止
      - name: 抓数（不完整则自动重试）
        run: |
          for i in 1 2 3; do
            npm run fetch || true
            S=$(node -p "JSON.parse(require('fs').readFileSync('data/latest.json','utf8')).status")
            echo "第 $i 次结果: $S"
            if [ "$S" = "ok" ]; then break; fi
            sleep 300
          done

      # 抓当日快讯并筛出每天的 3 条事件；配置 DEEPSEEK_API_KEY 时用大模型归纳，否则走关键词规则
      - name: 抓快讯 + 生成事件
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          node scripts/news.mjs

      # 股债性价比 / 债市 / 估值分位 / 基金风格；配置 IFIND_REFRESH_TOKEN 时用 iFinD，否则降级免费源
      - name: 海外与外部环境数据（美股/汇率/商品）
        run: |
          node scripts/global.mjs || true

      - name: 板块轮动数据（申万行业周线）
        run: |
          node scripts/rotation.mjs || true

      - name: 生成扩展板块数据
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          IFIND_REFRESH_TOKEN: ${{ secrets.IFIND_REFRESH_TOKEN }}
        run: |
          node scripts/assets.mjs || true

      - name: 构建 + 渲染自检
        run: |
          node scripts/build.mjs
          node scripts/check-render.mjs

      - name: 数据完整性闸门
        id: gate
        run: |
          OK=$(node -p "JSON.parse(require('fs').readFileSync('data/latest.json','utf8')).status")
          # 抓数失败时 latest.json 会是仓库里的旧文件，这里用"文件年龄"识破，避免拿上期数据覆盖页面
          AGE=$(( $(date +%s) - $(stat -c %Y data/latest.json 2>/dev/null || echo 0) ))
          echo "status=$OK  数据年龄=${AGE}s"
          if [ "$OK" != "ok" ] || [ "$AGE" -gt 1800 ]; then
            echo "::warning::抓数未成功（status=$OK，数据年龄 ${AGE}s），本次不发布，保留上一期页面"
            echo "status=stale" >> $GITHUB_OUTPUT
            node -p "JSON.stringify(JSON.parse(require('fs').readFileSync('data/latest.json','utf8')).checks,null,1)"
          else
            echo "status=ok" >> $GITHUB_OUTPUT
          fi

      # 仓库根目录的 index.html 就是网站首页（GitHub Pages 走分支发布）
      - name: 发布页面 + 归档 JSON
        if: steps.gate.outputs.status == 'ok'
        run: |
          cp dist/index.html index.html
          git config user.name "weekly-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html data/
          git diff --quiet --cached || git commit -m "weekly update $(date +%Y-%m-%d)"
          git push

      # 腾讯云这条先备着：默认域名恢复后自动生效，失败不影响 Pages
      - name: 部署到 CloudBase 静态托管 /weeklyreport
        if: steps.gate.outputs.status == 'ok'
        continue-on-error: true
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          COS_SDK_KEEPALIVE: 'false'
        run: |
          npm i -g @cloudbase/cli
          tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"
          tcb hosting deploy ./dist /weeklyreport -e "$TCB_ENV_ID"
